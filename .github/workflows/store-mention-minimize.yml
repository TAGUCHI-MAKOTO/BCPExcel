name: Store mention form minimize variant

on:
  push:
    paths:
      - '.github/workflows/store-mention-minimize.yml'

permissions:
  contents: write

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Store minimize variant
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, os, shutil, zipfile
          from pathlib import Path

          data = ''''''
          raw = base64.b64decode(data)
          target = Path('メンション依頼フォーム_HTA_最小化版')
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              z.extractall(target)
          PY

          rm -f .github/workflows/store-mention-minimize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Store mention request form minimize variant'
          git push
