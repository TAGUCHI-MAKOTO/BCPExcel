name: Store mention form minimize variant

on:
  push:
    paths:
      - '.github/workflows/store-mention-minimize.yml'

permissions:
  contents: write

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Store minimize variant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, re

          src = Path('メンション依頼フォーム_HTA_最新版')
          dst = Path('メンション依頼フォーム_HTA_最小化版')
          if dst.exists(): shutil.rmtree(dst)
          shutil.copytree(src, dst)

          hta = dst / 'メンション依頼フォーム.hta'
          js = dst / 'mention-form.js'
          worker = dst / 'mention-request-worker.js'
          css = dst / 'mention-form.css'
          readme = dst / 'README.txt'

          # HTA: add invisible HTML Help control used for minimization.
          t = hta.read_text(encoding='utf-8-sig')
          obj = '''\n<object id="HHCtrlMinimizeWindowObject"\n        classid="clsid:adb880a6-d8ff-11cf-9377-00aa003b7a11"\n        width="0" height="0"\n        style="position:absolute;left:-9999px;top:-9999px;">\n    <param name="Command" value="Minimize">\n</object>\n'''
          if 'id="HHCtrlMinimizeWindowObject"' not in t:
              t = re.sub(r'(?i)(<body[^>]*>)', r'\1' + obj, t, count=1)
          hta.write_text(t, encoding='utf-8-sig')

          # JS: add minimize UX helpers.
          t = js.read_text(encoding='utf-8-sig')
          helper = r'''\n\n/* =========================================================\n   受付後最小化＋実書き込みテスト\n   ・Pending保存後すぐWorkerを起動\n   ・新規送信だけ共有CSV書き込み開始を10秒遅延\n   ・受付モーダルOK押下後、フォームを最小化\n   ・共有CSV反映＋検証＋Pending削除後はWorkerが完了通知\n   ========================================================= */\nvar NEW_SEND_WRITE_DELAY_MS = 10000;\n\nfunction showAcceptedAndPrepareMinimize(){\n    var button=$("systemModalOkButton");\n\n    if(button){\n        button.onclick=confirmAcceptedAndMinimize;\n    }\n\n    showSystemModal(\n        "依頼を受け付けました",\n        "送信処理を開始しました。\\n\\nOKを押すとフォームを最小化します。",\n        "accepted",\n        true\n    );\n}\n\nfunction confirmAcceptedAndMinimize(){\n    hideSystemModal();\n\n    // 受付後に入力欄を初期化。拠点・依頼者は既存仕様どおり維持。\n    resetAfterSend();\n    setStatus("送信中です…");\n\n    // HTML Help ActiveX Control の Minimize コマンドで\n    // 現在のHTAウィンドウを直接最小化する。\n    window.setTimeout(function(){\n        var minimized=false;\n\n        try{\n            var ctrl=$("HHCtrlMinimizeWindowObject");\n            if(ctrl){\n                ctrl.Click();\n                minimized=true;\n            }\n        }catch(minErr){}\n\n        // ActiveX Controlが利用できない環境のみフォールバック。\n        if(!minimized){\n            try{\n                var shell=new ActiveXObject("WScript.Shell");\n                try{\n                    shell.AppActivate(document.title);\n                }catch(activateErr){}\n\n                shell.SendKeys("% ");\n                window.setTimeout(function(){\n                    try{\n                        shell.SendKeys("n");\n                    }catch(keyErr2){}\n                },180);\n            }catch(keyErr1){}\n        }\n    },150);\n}\n'''
          if 'var NEW_SEND_WRITE_DELAY_MS = 10000;' not in t:
              t = t.replace('var TYPE_OPTIONS = [', helper + '\nvar TYPE_OPTIONS = [', 1)

          m = re.search(r'function sendRequest\(\)\{', t)
          if not m: raise SystemExit('sendRequest not found')
          brace = t.find('{', m.start()); depth = 0; end = None
          for i in range(brace, len(t)):
              if t[i] == '{': depth += 1
              elif t[i] == '}':
                  depth -= 1
                  if depth == 0: end = i + 1; break
          if end is None: raise SystemExit('sendRequest end not found')
          new_send = r'''function sendRequest(){\n    if(!validateForm()){ return; }\n\n    var requests=[],i,req;\n    for(i=1;i<=visibleRequestCount;i++){\n        req=collectRequest(i);\n        if(i===1||hasAnyInput(req)){ requests.push(req); }\n    }\n\n    var requester=$("requesterName").innerText;\n    var requestId=createRequestId(requester);\n    var sentAt=formatDateTime(new Date());\n    var baseName=val("requestBase");\n    var lines=[];\n    var pendingPath="";\n\n    for(i=0;i<requests.length;i++){\n        lines.push(makeCsvLine(requestId,sentAt,baseName,requester,requests[i]));\n    }\n\n    try{\n        var csvFolder=getProductionCsvFolder(true);\n\n        // 1. まずPendingへ保存。\n        pendingPath=savePendingPackage(\n            baseName,\n            requester,\n            requestId,\n            sentAt,\n            requests,\n            lines,\n            csvFolder\n        );\n\n        beginPendingState("sending");\n\n        // 2. 新規送信は「送信ボタン押下から約10秒後」まで\n        //    共有CSVへの書き込み開始を待たせる。\n        var notBeforeMs=(new Date()).getTime()+NEW_SEND_WRITE_DELAY_MS;\n\n        // 3. Workerは先に別プロセス起動。\n        //    フォームを閉じてもWorker自体は継続する。\n        launchBackgroundWorker(pendingPath,csvFolder,notBeforeMs);\n\n        // 4. 受付完了を表示。OKでフォーム最小化。\n        showAcceptedAndPrepareMinimize();\n\n    }catch(err){\n        if(pendingPath && getPendingCount()>0){\n            pendingRetryState="failed";\n            pendingRetryStartedAt=0;\n            updatePendingRetryUI();\n        }else{\n            pendingRetryState="";\n            pendingRetryStartedAt=0;\n            updatePendingRetryUI();\n\n            alert(\n                "送信受付に失敗しました。\\n\\n"+\n                String(err.message||err.description||err)\n            );\n        }\n    }\n}'''
          t = t[:m.start()] + new_send + t[end:]
          t = t.replace('function launchBackgroundWorker(pendingPath,csvFolderFallback){', 'function launchBackgroundWorker(pendingPath,csvFolderFallback,notBeforeMs){', 1)
          old = '''    csvFolderFallback=String(csvFolderFallback||"");\n\n    /*\n      v28.3:\n      PowerShellを完全廃止。WorkerはASCIIのみで構成。\n      完了ポップアップ表示のため、wscript.exe の //B を廃止。\n      WSH(JScript) Workerを別プロセスで非同期起動する。\n      HTAを閉じてもWorkerは継続する。\n    */\n    var command=\n        "wscript.exe //NoLogo //E:JScript "+\n        quoteCommandArgument(workerPath)+" "+\n        quoteCommandArgument(pendingPath)+" "+\n        quoteCommandArgument(csvFolderFallback);'''
          new = '''    csvFolderFallback=String(csvFolderFallback||"");\n    notBeforeMs=parseInt(notBeforeMs,10);\n    if(isNaN(notBeforeMs) || notBeforeMs<0){\n        notBeforeMs=0;\n    }\n\n    /*\n      v28.3ベース:\n      Pure JScript Workerを別プロセスで非同期起動。\n      第3引数がある新規送信のみ、指定時刻まで共有CSV書き込みを待機する。\n      起動時復旧・手動再送は第3引数なしのため即時処理。\n    */\n    var command=\n        "wscript.exe //NoLogo //E:JScript "+\n        quoteCommandArgument(workerPath)+" "+\n        quoteCommandArgument(pendingPath)+" "+\n        quoteCommandArgument(csvFolderFallback)+" "+\n        quoteCommandArgument(String(notBeforeMs));'''
          if old not in t: raise SystemExit('launch block not found')
          t = t.replace(old, new, 1)
          js.write_text(t, encoding='utf-8-sig')

          # Worker: add optional not-before timestamp and wait before shared write.
          t = worker.read_text(encoding='ascii')
          old = '''    var pendingPath = String(args.Item(0) || "");\n    var csvFolder = String(args.Item(1) || "");\n\n    if (!pendingPath || !fso.FileExists(pendingPath)) {'''
          new = '''    var pendingPath = String(args.Item(0) || "");\n    var csvFolder = String(args.Item(1) || "");\n    var notBeforeMs = 0;\n\n    if (args.length >= 3) {\n        notBeforeMs = parseInt(String(args.Item(2) || "0"), 10);\n        if (isNaN(notBeforeMs) || notBeforeMs < 0) {\n            notBeforeMs = 0;\n        }\n    }\n\n    if (!pendingPath || !fso.FileExists(pendingPath)) {'''
          if old not in t: raise SystemExit('worker args block not found')
          t = t.replace(old, new, 1)
          old = '''    if (!csvFolder || !fso.FolderExists(csvFolder)) {\n        WScript.Quit(3);\n    }\n\n    var pending;'''
          new = '''    if (!csvFolder || !fso.FolderExists(csvFolder)) {\n        WScript.Quit(3);\n    }\n\n    // New-send LT: wait until the absolute not-before time.\n    // Recovery/manual retry has no delay because arg 3 is zero/omitted.\n    while (notBeforeMs > 0 && new Date().getTime() < notBeforeMs) {\n        if (!fso.FileExists(pendingPath)) {\n            WScript.Quit(0);\n        }\n\n        var remaining = notBeforeMs - new Date().getTime();\n        WScript.Sleep(remaining > 250 ? 250 : remaining);\n    }\n\n    var pending;'''
          if old not in t: raise SystemExit('worker wait block not found')
          t = t.replace(old, new, 1)
          worker.write_bytes(t.encode('ascii'))

          # CSS: purple accepted modal.
          t = css.read_text(encoding='utf-8-sig').rstrip()
          purple = r'''\n\n/* ===== 受付完了ポップアップ：フォーム基調の紫テーマ ===== */\n.system-modal-accepted{\n    background:#f4efff !important;\n    border:2px solid #8d6ccf !important;\n    box-shadow:0 10px 28px rgba(92,66,150,.24) !important;\n}\n\n.system-modal-accepted .system-modal-title,\n.system-modal-accepted #systemModalTitle{\n    color:#5e4596 !important;\n}\n\n.system-modal-accepted .system-modal-message,\n.system-modal-accepted #systemModalMessage{\n    color:#3f3554 !important;\n}\n\n.system-modal-accepted .system-modal-button,\n.system-modal-accepted #systemModalOkButton{\n    background:#7656b5 !important;\n    border-color:#684aa7 !important;\n    color:#fff !important;\n}\n\n.system-modal-accepted .system-modal-button:hover,\n.system-modal-accepted #systemModalOkButton:hover{\n    background:#6748a5 !important;\n}\n'''
          t += purple
          css.write_text(t, encoding='utf-8-sig')

          # README: exact test-version notes.
          readme.write_text('''メンション依頼フォーム v28.3ベース\n受付後最小化＋実書き込み＋10秒LT テスト版\n============================================================\n\n■ 今回のテスト仕様\n\n実際にPending保存／Worker起動／共有CSV書き込みを行います。\n\n送信の流れ：\n1. 送信ボタン押下\n2. Pending CSVを保存\n3. Pure JScript Workerを起動\n4. 紫色の「依頼を受け付けました」モーダルを表示\n5. OK押下でフォームを自動最小化\n6. 送信ボタン押下から約10秒経過するまでWorkerが待機\n7. 共有の「書き込み用」CSVへ作成／追記\n8. 書き込み後に再読込確認\n9. 成功時のみPending CSV削除\n10. Workerから「送信完了」ポップアップを表示\n\n■ 10秒LTについて\n\n新規送信だけ、送信時に「書き込み開始可能時刻」をWorkerへ渡します。\nWorkerはその時刻まで待ってから共有CSVへアクセスします。\n\n・新規送信：10秒LTあり\n・起動時の未送信復旧：LTなし\n・手動再送：LTなし\n\nそのため、未送信復旧を無駄に10秒待たせません。\n\n■ 最小化\n\n自宅PCで動作確認できた\nHTML Help ActiveX Control の Minimize コマンドを使用します。\n\n■ 維持しているv28.3の安全対策\n\n・Pure JScript Worker\n・WorkerはASCII／BOMなし\n・PowerShellなし\n・.ps1なし\n・ログなし\n・PendingはCSVのみ\n・フォームを閉じてもWorker継続\n・.jlock排他制御\n・RequestID＋依頼番号の重複防止\n・部分復旧\n・最大300秒再試行\n・書き込み後再確認\n・成功時のみPending削除\n・完了後ポップアップ\n\n■ 注意\n\nこれは本番採用前の実書き込みテスト版です。\n自宅PC／会社PCで挙動を確認してから最新版へ反映してください。\n''', encoding='utf-8-sig')
          PY

          rm -f .github/workflows/store-mention-minimize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Store mention request form minimize variant'
          git push
