name: Promote v28.23 exact source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'Stage v28.23 encoding-fixed promotion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact v28.23 mention-form patch
        shell: bash
        run: |
          set -euo pipefail
          git apply .github/v2823_exact.patch

      - name: Verify exact package blobs and syntax
        shell: bash
        run: |
          set -euo pipefail
          JS='メンション依頼フォーム_HTA_最新版/mention-form.js'
          README='メンション依頼フォーム_HTA_最新版/README.txt'
          WORKER='メンション依頼フォーム_HTA_最新版/mention-request-worker.js'
          CSS='メンション依頼フォーム_HTA_最新版/mention-form.css'
          HTA='メンション依頼フォーム_HTA_最新版/メンション依頼フォーム.hta'
          PLACEHOLDER='メンション依頼フォーム_HTA_最新版/書き込み用/このフォルダにCSVが作成されます.txt'

          test "$(git hash-object "$JS")" = '44ac10b0926ab7c0de4da6c8a9a86c41375e9c71'
          test "$(git hash-object "$README")" = 'd5d7cfe9e2bd11da6116d3e0a8f93f992f863269'
          test "$(git hash-object "$WORKER")" = 'c105e54da9d301813a9cc5a70c96e47f805d7766'
          test "$(git hash-object "$CSS")" = '02ed2fd461e3f14083e892c2829adc35708902dd'
          test "$(git hash-object "$HTA")" = 'd7b5e79fe5a36baa9cf00314a6363640314054c9'
          test "$(git hash-object "$PLACEHOLDER")" = '6748f66e8e0b929f85c7e7f1bcf7d37e0f3fd3f5'

          node --check "$JS"
          node --check "$WORKER"
          python3 - <<'PY'
          from pathlib import Path
          root = Path('メンション依頼フォーム_HTA_最新版')
          for name in ['README.txt','mention-form.css','mention-form.js','メンション依頼フォーム.hta']:
              assert (root/name).read_bytes().startswith(b'\xef\xbb\xbf'), name
          worker=(root/'mention-request-worker.js').read_bytes()
          assert not worker.startswith(b'\xef\xbb\xbf')
          worker.decode('ascii')
          PY

      - name: Remove temporary promotion helpers
        shell: bash
        run: |
          rm -f .github/v2823_exact.patch .github/workflows/promote-v2823-exact.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit exact v28.23 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TAGUCHI-MAKOTO'
          git config user.email 'akuteon84@gmail.com'
          git add -A
          git commit -m 'Promote v28.23 encoding-fixed mention form as latest'
          git push origin HEAD:main
