name: Materialize mention HTA v14

on:
  push:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update latest folder to v14
        run: python3 .repo_upload_v14/materialize.py

      - name: Remove temporary updater files
        run: |
          rm -rf .repo_upload_v14
          rm -f .github/workflows/materialize-mention-v14.yml

      - name: Commit v14 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update mention request form latest to v14"
          git push
