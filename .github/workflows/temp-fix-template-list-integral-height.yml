name: Fix template list last item visibility

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/fix-template-list-integral-height'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Fix ListBox integral height
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('テンプレ管理用.bas')
          raw = p.read_bytes()
          text = raw.decode('cp932')
          old = '        .IntegralHeight = False'
          new = '        .IntegralHeight = True'
          if text.count(old) != 1:
              raise SystemExit(f'expected 1 target, found {text.count(old)}')
          p.write_bytes(text.replace(old, new, 1).encode('cp932'))
          PY

      - name: Commit patch and clean workflow
        shell: bash
        run: |
          rm -f .github/workflows/temp-fix-template-list-integral-height.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "テンプレ管理用.bas" .github/workflows/temp-fix-template-list-integral-height.yml
          git commit -m "テンプレ管理リストの最終項目表示を修正"
          git push origin HEAD:${{ github.head_ref }}