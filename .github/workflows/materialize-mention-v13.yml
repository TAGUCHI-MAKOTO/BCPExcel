name: Materialize mention HTA v13

on:
  push:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize files
        run: python3 .repo_upload/materialize.py

      - name: Commit files
        run: |
          rm -f .github/workflows/materialize-mention-v13.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update mention request form latest and demo to v13"
          git push
