name: Align template list bottom

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/template-manager-list-align-329'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Align list height
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('テンプレ管理用.bas')
          raw = p.read_bytes()
          try:
              text = raw.decode('utf-8')
              enc = 'utf-8'
          except UnicodeDecodeError:
              text = raw.decode('cp932')
              enc = 'cp932'
          old = '    AddListBox designer, "lstResults", 415, 113, 365, 348'
          new = '    AddListBox designer, "lstResults", 415, 113, 365, 329'
          if text.count(old) != 1:
              raise SystemExit(f'expected 1 target, found {text.count(old)}')
          p.write_bytes(text.replace(old, new, 1).encode(enc))
          PY

      - name: Commit patch and clean workflow
        shell: bash
        run: |
          rm -f .github/workflows/temp-align-template-list-329.yml
          rm -f .github/temp-align-list-329-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "テンプレ管理用.bas" .github/workflows/temp-align-template-list-329.yml .github/temp-align-list-329-trigger
          git commit -m "テンプレ管理リスト下端をボタンに揃える"
          git push origin HEAD:${{ github.head_ref }}
