name: Update mention form to v28.3

on:
  push:
    paths:
      - '.github/workflows/update-mention-v28-3.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v28.3 files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, subprocess, hashlib

          patch_z64 = ''''''
          worker_z64 = ''''''
          readme_z64 = ''''''

          def dec(s):
              return zlib.decompress(base64.b64decode(s))

          patch = dec(patch_z64)
          worker = dec(worker_z64)
          readme = dec(readme_z64)

          subprocess.run(['git', 'apply', '--whitespace=nowarn', '-'], input=patch, check=True)

          root = Path('メンション依頼フォーム_HTA_最新版')
          (root / 'mention-request-worker.js').write_bytes(worker)
          (root / 'README.txt').write_bytes(readme)

          old_worker = root / 'mention-request-worker.ps1'
          if old_worker.exists():
              old_worker.unlink()

          expected = {
              root / 'mention-form.js': '6d7ee6107f3daa69103a07fc7a67c0f5577466e063327577cb65778a82c9557c',
              root / 'mention-request-worker.js': 'e5a93b60487366b1dc6407b100ba0478ecf28ac5d57aa7c3cba9908772112cec',
              root / 'README.txt': 'b3b99a4b453476a9604721841162fa6948eab730de4633ca62babcd3fa4f5acd',
          }
          for path, want in expected.items():
              got = hashlib.sha256(path.read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f'hash mismatch: {path}: {got} != {want}')
          PY

      - name: Commit v28.3 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/update-mention-v28-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update mention request form production to v28.3"
          git push origin main
