name: Fix VBA encoding

on:
  push:
    paths:
      - '.github/workflows/fix-vba-encoding.yml'

permissions:
  contents: write

jobs:
  fix-encoding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace VBA file with clean UTF-8 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip

          payload = ''''''

          data = gzip.decompress(base64.b64decode(payload))
          Path('SPH現場コントロール_修正版VBA.bas').write_bytes(data)
          PY

      - name: Commit converted file
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'SPH現場コントロール_修正版VBA.bas'
          if ! git diff --cached --quiet; then
            git commit -m 'Fix VBA file encoding to UTF-8'
            git push
          fi
