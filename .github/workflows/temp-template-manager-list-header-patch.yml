name: Repair template manager list headers

on:
  pull_request:
    types:
      - edited

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Repair BAS formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("テンプレ管理用.bas")
          raw = path.read_bytes()

          if raw.startswith(b"\xef\xbb\xbf"):
              source_encoding = "utf-8-sig"
              text = raw.decode(source_encoding)
          else:
              try:
                  text = raw.decode("utf-8")
                  source_encoding = "utf-8"
              except UnicodeDecodeError:
                  text = raw.decode("cp932")
                  source_encoding = "cp932"

          nl = "\r\n" if "\r\n" in text else "\n"

          malformed_boundary = "End Sub'============================================================"
          if text.count(malformed_boundary) != 1:
              raise SystemExit(f"header boundary: expected 1 match, found {text.count(malformed_boundary)}")
          text = text.replace(
              malformed_boundary,
              "End Sub" + nl + nl + "'============================================================",
              1,
          )

          old_widths = nl.join([
              "        .ColumnCount = 3",
              "            .ColumnWidths = _",
              "                CStr(45 * mFormScale) & \" pt;\" & _",
              "                CStr(140 * mFormScale) & \" pt;\" & _",
              "                CStr(64 * mFormScale) & \" pt\"",
              "    ",
              "        .IntegralHeight = False",
          ])
          new_widths = nl.join([
              "        .ColumnCount = 3",
              "        .ColumnWidths = _",
              "            CStr(45 * mFormScale) & \" pt;\" & _",
              "            CStr(140 * mFormScale) & \" pt;\" & _",
              "            CStr(64 * mFormScale) & \" pt\"",
              "        .IntegralHeight = False",
          ])

          if text.count(old_widths) != 1:
              raise SystemExit(f"column widths: expected 1 match, found {text.count(old_widths)}")
          text = text.replace(old_widths, new_widths, 1)

          forbidden = [
              "btnCopyOriginal",
              "原本を選択ファイルへ反映する",
              malformed_boundary,
          ]
          for value in forbidden:
              if value in text:
                  raise SystemExit(f"forbidden remnant: {value}")

          required = [
              'AddHeaderText designer, "lblHeadID", "ID"',
              'AddHeaderText designer, "lblHeadSubject", "件名"',
              'AddHeaderText designer, "lblHeadTag", "タグ"',
              ".ColumnCount = 3",
              'Me.lstResults.List(Me.lstResults.ListCount - 1, 2) = tagText',
              "Private Sub AddHeaderBar( _",
              "Private Sub AddHeaderText( _",
              "Private Sub AddHeaderDivider( _",
          ]
          for value in required:
              if value not in text:
                  raise SystemExit(f"required output missing: {value}")

          path.write_bytes(text.encode(source_encoding))
          PY

      - name: Commit repair and remove temporary trigger
        shell: bash
        run: |
          rm -f .github/temp-template-manager-list-header-patch-trigger
          rm -f .github/workflows/temp-repair-template-manager.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "テンプレ管理用.bas" .github/temp-template-manager-list-header-patch-trigger .github/workflows/temp-repair-template-manager.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "テンプレ管理フォームの見出し構文を整形"
          git push origin HEAD:${{ github.head_ref }}
