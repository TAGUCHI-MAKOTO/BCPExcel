name: Promote tested mention form final

on:
  push:
    paths:
      - '.github/workflows/promote-tested-mention-form-final.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production base
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            path="$1"
            expected="$2"
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "Unexpected base blob: $path $actual != $expected"
              exit 1
            fi
          }
          check_blob 'メンション依頼フォーム_HTA_最新版/mention-form.css' 'e078a6cbbe30fbdadff299c2533aaf0cb53184a4'
          check_blob 'メンション依頼フォーム_HTA_最新版/mention-form.js' 'fcbf500bc2651eb97468a55773024ab33f76466b'
          check_blob 'メンション依頼フォーム_HTA_最新版/mention-request-worker.js' 'bfb2e396cbeb2d9c9a6697ca5107494e5dd286c4'
          check_blob 'メンション依頼フォーム_HTA_最新版/メンション依頼フォーム.hta' '6edc030578d5d03fdf9e4285ffdfa6f260e64d54'

      - name: Apply tested patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/final_patch_1.b64 \
              .github/tmp/final_patch_2.b64 \
              .github/tmp/final_patch_3.b64 \
              .github/tmp/final_patch_4.b64 \
              .github/tmp/final_patch_5.b64 \
              .github/tmp/final_patch_6.b64 \
            | tr -d '\n\r' | base64 -d > /tmp/final.patch
          git apply --check /tmp/final.patch
          git apply /tmp/final.patch

      - name: Verify exact production changes
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -c core.quotePath=false diff --name-only | sort)"
          expected=$'メンション依頼フォーム_HTA_最新版/mention-form.css\nメンション依頼フォーム_HTA_最新版/mention-form.js\nメンション依頼フォーム_HTA_最新版/mention-request-worker.js\nメンション依頼フォーム_HTA_最新版/メンション依頼フォーム.hta'
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected changed files:'
            printf '%s\n' "$actual"
            exit 1
          fi

      - name: Verify tested result
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            path="$1"
            expected="$2"
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "Blob mismatch: $path $actual != $expected"
              exit 1
            fi
          }
          check_blob 'メンション依頼フォーム_HTA_最新版/mention-form.css' '140e25c676b4cbe2d1d39959f91d02c3ae98bb91'
          check_blob 'メンション依頼フォーム_HTA_最新版/mention-form.js' '1611386a8f9dbef008fdc9f8dbca873f842a3560'
          check_blob 'メンション依頼フォーム_HTA_最新版/mention-request-worker.js' '1a915e207aa8fa4ca6da68e298f2823a819b42a7'
          check_blob 'メンション依頼フォーム_HTA_最新版/メンション依頼フォーム.hta' '6dff3c4da47c96e65568ae3ed3d4e2138bd04b66'
          node --check 'メンション依頼フォーム_HTA_最新版/mention-form.js'
          node --check 'メンション依頼フォーム_HTA_最新版/mention-request-worker.js'

      - name: Commit production version and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'メンション依頼フォーム_HTA_最新版/mention-form.css' \
            'メンション依頼フォーム_HTA_最新版/mention-form.js' \
            'メンション依頼フォーム_HTA_最新版/mention-request-worker.js' \
            'メンション依頼フォーム_HTA_最新版/メンション依頼フォーム.hta'
          git rm -f -- \
            '.github/tmp/final_patch_1.b64' \
            '.github/tmp/final_patch_2.b64' \
            '.github/tmp/final_patch_3.b64' \
            '.github/tmp/final_patch_4.b64' \
            '.github/tmp/final_patch_5.b64' \
            '.github/tmp/final_patch_6.b64' \
            '.github/workflows/promote-tested-mention-form-final.yml'
          git commit -m 'Promote tested mention form proxy CA 6 final'
          git push origin HEAD:main
