name: Export latest mention form

on:
  push:
    paths:
      - '.github/workflows/export-latest-mention-form.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('メンション依頼フォーム_HTA_最新版')
          out = Path('MentionRequestForm_最新版_20260916.zip')
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file():
                      z.write(p, p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MentionRequestForm_最新版_20260916
          path: MentionRequestForm_最新版_20260916.zip
          if-no-files-found: error
