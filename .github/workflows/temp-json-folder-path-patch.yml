name: Patch JSON folder path support

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-json-folder-path-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch BAS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("メンションテンプレ_JSON自動読込.bas")
          text = path.read_bytes().decode("utf-8-sig")
          nl = "\r\n" if "\r\n" in text else "\n"

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "'   テンプレート.json  ブックと同じフォルダーに配置（URL表示時はローカルの同階層を自動検索）",
              "'   テンプレート.json  JSON_FOLDER_PATHで指定したフォルダーを優先（空欄時は従来どおり自動検索）",
              "header comment",
          )

          const_marker = 'Private Const JSON_FILE_NAME As String = "テンプレート.json"' + nl
          const_lines = [
              "' JSON格納フォルダーを指定します。",
              "' 例: \"C:\\共有\\メンションテンプレ\"",
              "' %USERPROFILE% / %OneDrive% などの環境変数も使用できます。",
              "' 空欄の場合は従来どおりブックの場所から自動検索します。",
              'Private Const JSON_FOLDER_PATH As String = ""',
          ]
          replace_once(
              const_marker,
              const_marker + nl.join(const_lines) + nl,
              "JSON_FOLDER_PATH constant",
          )

          path_marker = (
              "    Dim localBookFolder As String" + nl + nl +
              "    '一度正常に読み込めた参照先が残っていれば最優先で使用します。"
          )
          path_lines = [
              "    Dim localBookFolder As String",
              "    Dim configuredFolder As String",
              "",
              "    '指定フォルダーが設定されている場合は、そこを最優先で使用します。",
              "    configuredFolder = JsonTemplateExpandEnvironmentVariables(Trim$(JSON_FOLDER_PATH))",
              "",
              "    If Len(configuredFolder) > 0 Then",
              "        If Not JsonTemplateFolderExists(configuredFolder) Then",
              "            Err.Raise vbObjectError + 2103, , _",
              "                      \"JSON格納フォルダーが見つかりません。\" & vbCrLf & configuredFolder",
              "        End If",
              "",
              "        JsonTemplateFilePath = JsonTemplateJoinPath(configuredFolder, JSON_FILE_NAME)",
              "        Exit Function",
              "    End If",
              "",
              "    '一度正常に読み込めた参照先が残っていれば最優先で使用します。",
          ]
          replace_once(
              path_marker,
              nl.join(path_lines),
              "JsonTemplateFilePath configuration",
          )

          join_marker = "Private Function JsonTemplateJoinPath( _" + nl
          helper_lines = [
              "Private Function JsonTemplateExpandEnvironmentVariables( _",
              "    ByVal sourcePath As String) As String",
              "",
              "    Dim shellObject As Object",
              "",
              "    If Len(Trim$(sourcePath)) = 0 Then Exit Function",
              "",
              "    On Error GoTo ExpandError",
              "    Set shellObject = CreateObject(\"WScript.Shell\")",
              "    JsonTemplateExpandEnvironmentVariables = _",
              "        Trim$(CStr(shellObject.ExpandEnvironmentStrings(sourcePath)))",
              "    Exit Function",
              "",
              "ExpandError:",
              "    JsonTemplateExpandEnvironmentVariables = sourcePath",
              "End Function",
              "",
          ]
          replace_once(
              join_marker,
              nl.join(helper_lines) + join_marker,
              "environment variable helper",
          )

          diagnostic_marker = (
              '        "現在の保存先: " & activeBookPath & vbCrLf & vbCrLf & _' + nl +
              '        "JSON参照先: " & resolvedPath & vbCrLf & _'
          )
          diagnostic_lines = [
              '        "現在の保存先: " & activeBookPath & vbCrLf & vbCrLf & _',
              '        "指定JSONフォルダー: " & IIf(Len(Trim$(JSON_FOLDER_PATH)) > 0, JSON_FOLDER_PATH, "未指定（自動検索）") & vbCrLf & _',
              '        "JSON参照先: " & resolvedPath & vbCrLf & _',
          ]
          replace_once(
              diagnostic_marker,
              nl.join(diagnostic_lines),
              "diagnostic output",
          )

          path.write_bytes(text.encode("utf-8"))
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/temp-json-folder-path-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "メンションテンプレ_JSON自動読込.bas" .github/workflows/temp-json-folder-path-patch.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "JSON参照先を指定フォルダ対応"
          git push
