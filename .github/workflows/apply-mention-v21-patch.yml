name: Apply mention HTA v21 patch

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact v14 to v21 patch
        shell: bash
        run: |
          git apply --check .repo_upload_v21b/v14_to_v21.patch
          git apply .repo_upload_v21b/v14_to_v21.patch

      - name: Verify v21 markers
        shell: bash
        run: |
          grep -q 'v21 操作ボタン切れ対策' 'メンション依頼フォーム_HTA_最新版/README.txt'
          grep -q 'bottom:10px;' 'メンション依頼フォーム_HTA_最新版/mention-form.css'
          grep -q 'var CSV_SUBFOLDER_NAME = "書き込み用";' 'メンション依頼フォーム_HTA_最新版/mention-form.js'
          grep -q 'WORKER_MAX_RETRY_SECONDS = 300' 'メンション依頼フォーム_HTA_最新版/mention-form.js'

      - name: Clean temporary updater files
        shell: bash
        run: |
          rm -rf .repo_upload_v21 .repo_upload_v21b
          rm -f .github/workflows/apply-mention-v21-patch.yml

      - name: Commit v21 latest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update mention request form latest to v21"
          git push
