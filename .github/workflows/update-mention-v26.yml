name: Update mention form to v26

on:
  push:
    branches: [main]
    paths:
      - '.tmp_mention_v26/READY'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact v26 archives
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp_mention_v26/prod.part01 .tmp_mention_v26/prod.part02 .tmp_mention_v26/prod.part03 .tmp_mention_v26/prod.part04 .tmp_mention_v26/prod.part05 | base64 -d > /tmp/prod-v26.zip
          cat .tmp_mention_v26/demo.part01 .tmp_mention_v26/demo.part02 .tmp_mention_v26/demo.part03 | base64 -d > /tmp/demo-v26.zip

          echo 'ad9e581d5c6f2a801975a332f9ec41a23d923e00e0f59cfb380b683510413a33  /tmp/prod-v26.zip' | sha256sum -c -
          echo '930859994089362de605e4184ce4b4e91f0d494e6216be4e88cc89d19185a90c  /tmp/demo-v26.zip' | sha256sum -c -

      - name: Replace production and demo folders
        shell: bash
        run: |
          set -euo pipefail
          PROD='メンション依頼フォーム_HTA_最新版'
          DEMO='メンション依頼フォーム_HTA_デモ版'

          rm -rf "$PROD" "$DEMO"
          mkdir -p "$PROD" "$DEMO"
          unzip -q /tmp/prod-v26.zip -d "$PROD"
          unzip -q /tmp/demo-v26.zip -d "$DEMO"

          # The staging files and one-shot workflow are not part of the final repository.
          rm -rf .tmp_mention_v26
          rm -f .github/workflows/update-mention-v26.yml

      - name: Commit v26 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Update mention request form production and demo to v26'
          git push origin HEAD:main
