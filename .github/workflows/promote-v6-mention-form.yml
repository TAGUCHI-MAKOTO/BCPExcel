name: Promote tested mention form v6

on:
  push:
    paths:
      - '.github/workflows/promote-v6-mention-form.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tested v6 patch
        shell: bash
        run: |
          cat > /tmp/v6.patch.b64 <<'EOF'

EOF
          base64 -d /tmp/v6.patch.b64 > /tmp/v6.patch
          git apply --check /tmp/v6.patch
          git apply /tmp/v6.patch

      - name: Verify exact tested file and scope
        shell: bash
        run: |
          git config core.quotePath false
          target='メンション依頼フォーム_HTA_最新版/mention-form.js'
          actual_blob="$(git hash-object -- "$target")"
          expected_blob='fcbf500bc2651eb97468a55773024ab33f76466b'
          if [ "$actual_blob" != "$expected_blob" ]; then
            echo "Unexpected target blob: $actual_blob"
            exit 1
          fi
          changed="$(git diff --name-only)"
          if [ "$changed" != "$target" ]; then
            echo 'Unexpected changed files:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check

      - name: Commit tested v6
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'メンション依頼フォーム_HTA_最新版/mention-form.js'
          git commit -m 'Prevent duplicate mention form launches'
          git push
