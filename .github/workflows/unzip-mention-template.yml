name: Expand mention template ZIP

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unzip-mention-template.yml

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand ZIP and commit files
        shell: bash
        run: |
          set -euo pipefail

          archive='メンションテンプレ_JSON自動読込.zip'
          test -f "$archive"

          unzip -o "$archive" -d .
          rm -f .github/workflows/unzip-mention-template.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No extracted changes found.'
            exit 0
          fi

          git commit -m 'メンションテンプレZIPを展開'
          git push origin HEAD:main
