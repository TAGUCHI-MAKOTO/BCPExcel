name: Promote v28.27 patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/promote-v2827-patch.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved v28.27 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .staging/patch_v2827.py
          node --check 'メンション依頼フォーム_HTA_最新版/mention-form.js'
          rm -rf .staging
          rm -f '.github/workflows/promote-v2827-exact.yml'
          rm -f '.github/workflows/promote-v2827-patch.yml'
      - name: Commit promoted latest version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TAGUCHI-MAKOTO'
          git config user.email 'akuteon84@gmail.com'
          git add -A
          git commit -m 'Promote v28.27 mention form as latest'
          git push origin HEAD:main
