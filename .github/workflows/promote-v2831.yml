name: Promote v28.31 mention form

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-v2831.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v28.31 and verify
        shell: bash
        run: |
          set -euo pipefail

          # Baseline must still be the v28.29 latest that was previously promoted.
          test "$(git hash-object 'メンション依頼フォーム_HTA_最新版/mention-form.js')" = '3dadbf9992f6f519b3407435d9e9ca556e42e6c8'
          test "$(git hash-object 'メンション依頼フォーム_HTA_最新版/mention-request-worker.js')" = 'c105e54da9d301813a9cc5a70c96e47f805d7766'
          test "$(git hash-object 'メンション依頼フォーム_HTA_最新版/mention-form.css')" = '9f4b0a471d2850feb1781e2acaee60a519dc25cd'
          test "$(git hash-object 'メンション依頼フォーム_HTA_最新版/メンション依頼フォーム.hta')" = 'd7b5e79fe5a36baa9cf00314a6363640314054c9'

          echo '' | base64 -d | gzip -d > /tmp/v2831.patch

          git apply --check /tmp/v2831.patch
          git apply /tmp/v2831.patch

          python3 - <<'PY'
          from pathlib import Path
          p = Path('メンション依頼フォーム_HTA_最新版/README.txt')
          raw = p.read_bytes()
          text = raw.decode('utf-8-sig')
          if not text.startswith('メンション依頼フォーム HTA 本番版 v28.31'):
              header = '''メンション依頼フォーム HTA 本番版 v28.31
          ============================================================

          ■ v28.31 修正内容（Pending自己修復）

          ・送信時、通常の退避CSVと同内容の復旧用コピー「*.csv.recovery」を同時作成します
          ・復旧用コピーは通常のPending件数には数えません
          ・通常Pendingが部分欠落／列不正／依頼数不一致／依頼No.欠落などで読めない場合、
            Workerが復旧用コピーを検証し、正常ならPrimary Pendingを自動修復して送信を継続します
          ・通常Pendingそのものが消失してRecoveryだけ残った場合も、Workerおよび次回起動時に復元します
          ・共有CSVへの書き込み＋再読込確認が成功した後、Recovery → Primaryの順に削除して完了します
          ・Recoveryまで壊れている／読めない場合は自己修復せず、安全停止＋Pending保持とします
          ・v28.30の「__N1～__N3」期待依頼数チェック、依頼No.連続性チェックはそのまま維持します
          ・旧Pending（Recoveryなし）も従来どおり再送可能です
          ・共有CSV16列、RequestID、ロック、再読込確認、300秒タイムアウト、完了Popup仕様は変更していません
          ・⑧「同一RequestID・内容相違」対策は今回には含めていません


          メンション依頼フォーム HTA 本番版 v28.30
          ============================================================

          ■ v28.30 修正内容（追加テスト⑥対策）

          ・1送信あたりの本来の依頼数を、退避CSVファイル名へ「__N1～__N3」として保持します
          ・Workerは共有CSVへ書き込む前に、退避CSVから読み取れた依頼数と期待依頼数を照合します
          ・期待3依頼なのに1依頼しか残っていない等の場合、書き込み・完了扱い・Pending削除を行いません
          ・依頼No.も1～期待依頼数まで全て揃っているか確認します
          ・異常時はPendingを保持したまま失敗通知となり、欠落した状態で「受付完了」にならないようにします
          ・v28.29以前に作成済みの旧Pending（__N情報なし）は従来どおり再送可能です
          ・共有CSVの16列構成、RequestID、ロック、再読込確認、300秒タイムアウト、Popup仕様は変更していません
          ・⑧「同一RequestID・内容相違」対策は今回には含めていません


          '''
              p.write_bytes(b'\xef\xbb\xbf' + (header + text).encode('utf-8'))
          PY

          node --check 'メンション依頼フォーム_HTA_最新版/mention-form.js'
          node --check 'メンション依頼フォーム_HTA_最新版/mention-request-worker.js'

          test "$(git hash-object 'メンション依頼フォーム_HTA_最新版/mention-form.js')" = 'c0f684a00384fc39f7c535ec32dd0b23e2a3f671'
          test "$(git hash-object 'メンション依頼フォーム_HTA_最新版/mention-request-worker.js')" = 'bfb2e396cbeb2d9c9a6697ca5107494e5dd286c4'
          test "$(git hash-object 'メンション依頼フォーム_HTA_最新版/mention-form.css')" = '9f4b0a471d2850feb1781e2acaee60a519dc25cd'
          test "$(git hash-object 'メンション依頼フォーム_HTA_最新版/メンション依頼フォーム.hta')" = 'd7b5e79fe5a36baa9cf00314a6363640314054c9'
          grep -q '本番版 v28.31' 'メンション依頼フォーム_HTA_最新版/README.txt'

          rm -f '.github/workflows/promote-v2831.yml'

      - name: Commit v28.31 latest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TAGUCHI-MAKOTO'
          git config user.email 'akuteon84@gmail.com'
          git add -A
          git commit -m 'Promote v28.31 mention form as latest'
          git push origin main
