name: Materialize mention HTA v21

on:
  push:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v21 latest folder
        shell: bash
        run: python3 .repo_upload_v21/materialize.py

      - name: Remove one-time workflow
        shell: bash
        run: rm -f .github/workflows/materialize-mention-v21.yml

      - name: Commit v21 latest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update mention request form latest to v21"
          git push
