name: Move send confirmation warning

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/move-send-confirm-warning.yml

permissions:
  contents: write

jobs:
  update-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move warning below popup title
        shell: python
        run: |
          from pathlib import Path

          path = Path("メンション依頼フォーム_HTA_最新版/メンション依頼フォーム.hta")
          text = path.read_text(encoding="utf-8-sig")

          old = '''        <div id="sendConfirmTitle" class="modal-title">送信前確認</div>
        <div id="sendConfirmMessage" class="modal-message">
            <div class="send-confirm-question">出社状況は相違ないですか？</div>
            <div id="sendConfirmDetails" class="send-confirm-details"></div>
        </div>
        <div class="send-confirm-warning">メールメモに【個人】【企業】情報記載はNGです</div>'''

          new = '''        <div id="sendConfirmTitle" class="modal-title">送信前確認</div>
        <div class="send-confirm-warning">メールメモに【個人】【企業】情報記載はNGです</div>
        <div id="sendConfirmMessage" class="modal-message">
            <div class="send-confirm-question">出社状況は相違ないですか？</div>
            <div id="sendConfirmDetails" class="send-confirm-details"></div>
        </div>'''

          if old not in text:
              raise SystemExit("Expected send-confirmation block was not found; no changes made.")

          updated = text.replace(old, new, 1)
          path.write_text(updated, encoding="utf-8-sig", newline="")

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "メンション依頼フォーム_HTA_最新版/メンション依頼フォーム.hta"
          if git diff --cached --quiet; then
            echo "No change to commit"
            exit 0
          fi
          git commit -m "Move send confirmation warning below title"
          git push