name: Move send confirmation warning

on:
  push:
    paths:
      - '.github/workflows/move-send-confirm-warning.yml'

permissions:
  contents: write

jobs:
  update-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move warning below popup title
        shell: python
        run: |
          from pathlib import Path

          path = Path('メンション依頼フォーム_HTA_最新版/メンション依頼フォーム.hta')
          text = path.read_text(encoding='utf-8-sig')
          title = '        <div id="sendConfirmTitle" class="modal-title">送信前確認</div>'
          warning = '        <div class="send-confirm-warning">メールメモに【個人】【企業】情報記載はNGです</div>'

          if title not in text:
              raise SystemExit('send confirmation title not found')
          if warning not in text:
              raise SystemExit('send confirmation warning not found')

          text = text.replace(warning + '\n', '', 1)
          text = text.replace(title + '\n', title + '\n' + warning + '\n', 1)
          path.write_text(text, encoding='utf-8-sig')

      - name: Commit change
        run: |
          git config user.name "TAGUCHI-MAKOTO"
          git config user.email "akuteon84@gmail.com"
          git add 'メンション依頼フォーム_HTA_最新版/メンション依頼フォーム.hta'
          git commit -m 'Move send confirmation warning below title' || exit 0
          git push