name: Fix send confirmation layout

on:
  push:
    paths:
      - '.github/workflows/fix-send-confirm-layout.yml'

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal send confirmation CSS fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('メンション依頼フォーム_HTA_最新版/mention-form.css')
          text = path.read_text(encoding='utf-8-sig')

          old = '''.send-confirm-modal{
              width:760px;
              min-height:270px;
              /* JSが動く前でもフォーム中央付近に来るようフォールバックを設定。 */
              margin-left:-380px;
              margin-top:-135px;
          }

          .send-confirm-modal .modal-message{
              min-height:145px;
              padding:20px 28px 10px 28px;
              text-align:left;
          }

          .send-confirm-question{
              margin-bottom:16px;
              text-align:center;
              font-size:20px;
              font-weight:bold;
          }

          /* v28.31 Notice: 情報漏洩リスクの注意喚起。送信処理には影響しない表示のみ。 */
          .send-confirm-warning{
              margin:8px 0 6px 0;
              text-align:center;
              font-size:20px;
              font-weight:bold;
              color:#c62828;
          }'''

          new = '''.send-confirm-modal{
              width:760px;
              min-height:270px;
              /* JSが動く前でもフォーム中央付近に来るようフォールバックを設定。 */
              margin-left:-380px;
              margin-top:-135px;
              overflow:hidden;
          }

          .send-confirm-modal .modal-title{
              padding:10px 20px;
          }

          .send-confirm-modal .modal-message{
              min-height:125px;
              padding:14px 28px 6px 28px;
              text-align:left;
          }

          .send-confirm-modal .cancel-modal-actions{
              padding-top:2px;
          }

          .send-confirm-question{
              margin-bottom:16px;
              text-align:center;
              font-size:20px;
              font-weight:bold;
          }

          /* v28.31 Notice: 情報漏洩リスクの注意喚起。送信処理には影響しない表示のみ。 */
          .send-confirm-warning{
              margin:6px 0 2px 0;
              text-align:center;
              font-size:20px;
              font-weight:bold;
              color:#c62828;
          }'''

          if old not in text:
              raise SystemExit('Expected send-confirm CSS block was not found; no changes made.')

          updated = text.replace(old, new, 1)
          path.write_text(updated, encoding='utf-8-sig')

      - name: Verify and commit only target CSS
        shell: bash
        run: |
          git add -- 'メンション依頼フォーム_HTA_最新版/mention-form.css'
          changed="$(git -c core.quotePath=false diff --cached --name-only)"
          expected='メンション依頼フォーム_HTA_最新版/mention-form.css'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix send confirmation spacing and top corners'
          git push
